[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocrdiffalign"
version = "0.2.0"
description = "Align noisy Hebrew OCR output (plain text or PAGE-XML) against a reference text."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "John Locke" }]
keywords = ["hebrew", "ocr", "alignment", "page-xml", "manuscripts", "fastapi", "svelte"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
    "Framework :: FastAPI",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "rapidfuzz>=3.9,<4.0",
    "lxml>=5.2,<7.0",
    "python-multipart>=0.0.9,<0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
ocrdiff = "ocrdiffalign.cli:main"

[project.urls]
Homepage = "https://github.com/johnlockejrr/OcrDiffAlign"
Repository = "https://github.com/johnlockejrr/OcrDiffAlign"
Issues = "https://github.com/johnlockejrr/OcrDiffAlign/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ocrdiffalign"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ocrdiffalign",
    "tests",
    "ref",
    "samples",
    "frontend",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -ra"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["frontend", "aligned", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["src/ocrdiffalign"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
